<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Enrique Bodí — AI Agent Engineer and LLM Engineer, Founder of FundRadar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F52FF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.6"/>

  <!-- agent graph motif -->
  <g stroke="#374151" stroke-width="2" fill="none">
    <path d="M880 90 L980 60 L1080 110 L1010 190 L900 200 Z"/>
    <path d="M980 60 L1010 190"/>
    <path d="M880 90 L1080 110"/>
  </g>
  <g fill="#0D1117" stroke-width="3">
    <circle cx="880" cy="90" r="12" stroke="#7F52FF"/>
    <circle cx="980" cy="60" r="10" stroke="#22D3EE"/>
    <circle cx="1080" cy="110" r="12" stroke="#7F52FF"/>
    <circle cx="1010" cy="190" r="14" stroke="#22D3EE"/>
    <circle cx="900" cy="200" r="10" stroke="#7F52FF"/>
  </g>

  <rect x="60" y="64" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="60" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F9FAFB">Enrique Bodí</text>
  <text x="60" y="168" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="url(#accent)">AI Agent Engineer · LLM Engineer · Founder of FundRadar</text>
  <text x="60" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9CA3AF">&gt; agents · private RAG · workflow automation · Kotlin &amp; Python</text>
  <text x="60" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6B7280">Valencia, Spain · remote across Europe</text>
</svg>
